name: QSA-003 reproducible verifier build

on:
  pull_request:
    branches: [master, "prototype/qsa003-canonical-signed-context"]
    paths:
      - ".github/workflows/qsa003-build-provenance.yml"
      - "extensions/qembed_context_verify/**"
      - "docs/QSA003_BUILD_PROVENANCE.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_IMAGE: pgvector/pgvector:0.8.7-pg19-bookworm@sha256:9fd1e61398799f1d6b64a852bce2bb59863c0ebbcd96178e20c7b10059e9ea5e

jobs:
  build-a:
    name: Independent build A
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build verifier in pinned PostgreSQL 19 environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/build-a"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          docker run --rm --entrypoint bash \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$RUNNER_TEMP/build-a:/out" \
            --workdir /workspace \
            --env SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            --env BUILD_IMAGE="$BUILD_IMAGE" \
            "$BUILD_IMAGE" -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential pkg-config libsodium-dev postgresql-server-dev-19
              test "$(pg_config --version | cut -d" " -f1-2)" = "PostgreSQL 19.0"
              export ZERO_AR_DATE=1
              make -C extensions/qembed_context_verify clean
              make -C extensions/qembed_context_verify \
                PG_CONFIG="$(command -v pg_config)" \
                PG_CFLAGS="-ffile-prefix-map=/workspace=."
              install -D extensions/qembed_context_verify/qembed_context_verify.so \
                /out/qembed_context_verify.so
              {
                echo "base_image=$BUILD_IMAGE"
                echo "source_date_epoch=$SOURCE_DATE_EPOCH"
                echo "postgres=$(pg_config --version)"
                echo "compiler=$(cc -dumpfullversion -dumpversion)"
                echo "libsodium=$(pkg-config --modversion libsodium)"
                dpkg-query -W -f="\${binary:Package}=\${Version}\n" \
                  build-essential pkg-config libsodium-dev postgresql-server-dev-19 | sort
              } > /out/toolchain.txt
            '
          test -s "$RUNNER_TEMP/build-a/qembed_context_verify.so"
          test -s "$RUNNER_TEMP/build-a/toolchain.txt"
          sha256sum "$RUNNER_TEMP/build-a/qembed_context_verify.so" \
            > "$RUNNER_TEMP/build-a/sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: qsa003-build-a
          path: ${{ runner.temp }}/build-a/
          if-no-files-found: error
          retention-days: 30

  build-b:
    name: Independent build B
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build verifier in pinned PostgreSQL 19 environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/build-b"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          docker run --rm --entrypoint bash \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$RUNNER_TEMP/build-b:/out" \
            --workdir /workspace \
            --env SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            --env BUILD_IMAGE="$BUILD_IMAGE" \
            "$BUILD_IMAGE" -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential pkg-config libsodium-dev postgresql-server-dev-19
              test "$(pg_config --version | cut -d" " -f1-2)" = "PostgreSQL 19.0"
              export ZERO_AR_DATE=1
              make -C extensions/qembed_context_verify clean
              make -C extensions/qembed_context_verify \
                PG_CONFIG="$(command -v pg_config)" \
                PG_CFLAGS="-ffile-prefix-map=/workspace=."
              install -D extensions/qembed_context_verify/qembed_context_verify.so \
                /out/qembed_context_verify.so
              {
                echo "base_image=$BUILD_IMAGE"
                echo "source_date_epoch=$SOURCE_DATE_EPOCH"
                echo "postgres=$(pg_config --version)"
                echo "compiler=$(cc -dumpfullversion -dumpversion)"
                echo "libsodium=$(pkg-config --modversion libsodium)"
                dpkg-query -W -f="\${binary:Package}=\${Version}\n" \
                  build-essential pkg-config libsodium-dev postgresql-server-dev-19 | sort
              } > /out/toolchain.txt
            '
          test -s "$RUNNER_TEMP/build-b/qembed_context_verify.so"
          test -s "$RUNNER_TEMP/build-b/toolchain.txt"
          sha256sum "$RUNNER_TEMP/build-b/qembed_context_verify.so" \
            > "$RUNNER_TEMP/build-b/sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: qsa003-build-b
          path: ${{ runner.temp }}/build-b/
          if-no-files-found: error
          retention-days: 30

  verify-and-attest:
    name: Compare independent builds and attest the verified binary
    needs: [build-a, build-b]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: qsa003-build-a
          path: verified/build-a

      - uses: actions/download-artifact@v4
        with:
          name: qsa003-build-b
          path: verified/build-b

      - name: Require identical binary and toolchain fingerprints
        shell: bash
        run: |
          set -euo pipefail
          cmp verified/build-a/qembed_context_verify.so verified/build-b/qembed_context_verify.so
          cmp verified/build-a/toolchain.txt verified/build-b/toolchain.txt
          cmp verified/build-a/sha256.txt verified/build-b/sha256.txt
          cp verified/build-a/qembed_context_verify.so verified/qembed_context_verify.so
          cp verified/build-a/toolchain.txt verified/toolchain.txt
          cp verified/build-a/sha256.txt verified/sha256.txt
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo "source_ref=$GITHUB_REF"
            echo "binary_sha256=$(cut -d' ' -f1 verified/sha256.txt)"
            echo "independent_builds=2 separate GitHub-hosted runners"
            echo "toolchain_match=byte-identical package and compiler fingerprint"
            echo "binary_match=byte-identical shared object"
          } > verified/provenance-summary.txt

      - name: Attest the binary with GitHub build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: verified/qembed_context_verify.so

      - name: Verify the published attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify verified/qembed_context_verify.so \
            --repo "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@v4
        with:
          name: qsa003-verified-build-and-provenance
          path: verified/
          if-no-files-found: error
          retention-days: 90
