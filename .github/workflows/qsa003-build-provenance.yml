name: QSA-003 reproducible verifier build

on:
  pull_request:
    branches: [master, "prototype/qsa003-canonical-signed-context"]
    paths:
      - ".github/workflows/qsa003-build-provenance.yml"
      - "ci/qsa003-toolchain/**"
      - "extensions/qembed_context_verify/**"
      - "docs/QSA003_BUILD_PROVENANCE.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-a:
    name: Independent build A
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build verifier from archived toolchain
        shell: bash
        env:
          TOOLCHAIN_IMAGE: ghcr.io/qembed/qembed-sql/qsa003-toolchain@sha256:00058adbd06e8c28d00257af30fd75d60474e4d540e745c8c1420be8a6be912c
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/build-a"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          docker run --rm --entrypoint bash \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$RUNNER_TEMP/build-a:/out" \
            --workdir /workspace \
            --env SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            --env TOOLCHAIN_IMAGE="$TOOLCHAIN_IMAGE" \
            "$TOOLCHAIN_IMAGE" -euo pipefail -c '
              test "$(pg_config --version | cut -d" " -f1-2)" = "PostgreSQL 19.0"
              export ZERO_AR_DATE=1
              make -C extensions/qembed_context_verify clean
              make -C extensions/qembed_context_verify PG_CONFIG="$(command -v pg_config)"
              install -D extensions/qembed_context_verify/qembed_context_verify.so /out/qembed_context_verify.so
              cat /opt/qsa003/toolchain/metadata.txt > /out/toolchain.txt
              cat /opt/qsa003/toolchain/dpkg-packages.txt >> /out/toolchain.txt
              echo "toolchain_image=$TOOLCHAIN_IMAGE" >> /out/toolchain.txt
            '
          test -s "$RUNNER_TEMP/build-a/qembed_context_verify.so"
          test -s "$RUNNER_TEMP/build-a/toolchain.txt"
          (cd "$RUNNER_TEMP/build-a" && sha256sum qembed_context_verify.so) > "$RUNNER_TEMP/build-a/sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: qsa003-build-a
          path: ${{ runner.temp }}/build-a/
          if-no-files-found: error
          retention-days: 30

  build-b:
    name: Independent build B
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build verifier from archived toolchain
        shell: bash
        env:
          TOOLCHAIN_IMAGE: ghcr.io/qembed/qembed-sql/qsa003-toolchain@sha256:00058adbd06e8c28d00257af30fd75d60474e4d540e745c8c1420be8a6be912c
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/build-b"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          docker run --rm --entrypoint bash \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$RUNNER_TEMP/build-b:/out" \
            --workdir /workspace \
            --env SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            --env TOOLCHAIN_IMAGE="$TOOLCHAIN_IMAGE" \
            "$TOOLCHAIN_IMAGE" -euo pipefail -c '
              test "$(pg_config --version | cut -d" " -f1-2)" = "PostgreSQL 19.0"
              export ZERO_AR_DATE=1
              make -C extensions/qembed_context_verify clean
              make -C extensions/qembed_context_verify PG_CONFIG="$(command -v pg_config)"
              install -D extensions/qembed_context_verify/qembed_context_verify.so /out/qembed_context_verify.so
              cat /opt/qsa003/toolchain/metadata.txt > /out/toolchain.txt
              cat /opt/qsa003/toolchain/dpkg-packages.txt >> /out/toolchain.txt
              echo "toolchain_image=$TOOLCHAIN_IMAGE" >> /out/toolchain.txt
            '
          test -s "$RUNNER_TEMP/build-b/qembed_context_verify.so"
          test -s "$RUNNER_TEMP/build-b/toolchain.txt"
          (cd "$RUNNER_TEMP/build-b" && sha256sum qembed_context_verify.so) > "$RUNNER_TEMP/build-b/sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: qsa003-build-b
          path: ${{ runner.temp }}/build-b/
          if-no-files-found: error
          retention-days: 30

  verify-and-attest:
    name: Compare independent builds and attest the verified binary
    needs: [build-a, build-b]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: qsa003-build-a
          path: verified/build-a

      - uses: actions/download-artifact@v4
        with:
          name: qsa003-build-b
          path: verified/build-b

      - name: Require identical binary and archived toolchain fingerprints
        shell: bash
        run: |
          set -euo pipefail
          cmp verified/build-a/qembed_context_verify.so verified/build-b/qembed_context_verify.so
          cmp verified/build-a/toolchain.txt verified/build-b/toolchain.txt
          cmp verified/build-a/sha256.txt verified/build-b/sha256.txt
          cp verified/build-a/qembed_context_verify.so verified/qembed_context_verify.so
          cp verified/build-a/toolchain.txt verified/toolchain.txt
          cp verified/build-a/sha256.txt verified/sha256.txt
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo "source_ref=$GITHUB_REF"
            echo "binary_sha256=$(cut -d' ' -f1 verified/sha256.txt)"
            echo "independent_builds=2 separate GitHub-hosted runners"
            echo "toolchain_match=byte-identical archived OCI digest and package inventory"
            echo "binary_match=byte-identical shared object"
          } > verified/provenance-summary.txt

      - name: Attest the binary with GitHub build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: verified/qembed_context_verify.so

      - name: Verify the published attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify verified/qembed_context_verify.so \
            --repo "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@v4
        with:
          name: qsa003-verified-build-and-provenance
          path: verified/
          if-no-files-found: error
          retention-days: 90
