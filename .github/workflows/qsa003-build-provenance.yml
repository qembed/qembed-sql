name: QSA-003 reproducible verifier build

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/qsa003-build-provenance.yml"
      - "extensions/qembed_context_verify/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  reproducible-build:
    name: Rebuild verifier twice and attest build output
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Prepare a fixed PostgreSQL 19 build environment
        run: |
          docker run --detach --name qembed-builder-seed \
            --entrypoint bash \
            pgvector/pgvector:0.8.7-pg19-bookworm \
            -lc 'sleep infinity'
          docker exec --user root qembed-builder-seed bash -euxc '
            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential pkg-config libsodium-dev postgresql-server-dev-19
            test "$(pg_config --version | cut -d" " -f1-2)" = "PostgreSQL 19.0"
          '
          docker commit qembed-builder-seed qembed-qsa003-builder:ci
          docker rm -f qembed-builder-seed

      - name: Build in two isolated containers from the same toolchain image
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          for instance in qembed-build-a qembed-build-b; do
            docker run --detach --name "$instance" \
              --entrypoint bash qembed-qsa003-builder:ci -lc 'sleep infinity'
            docker cp extensions/qembed_context_verify "$instance:/tmp/qembed_context_verify"
            docker exec --user root "$instance" bash -euxc '
              export SOURCE_DATE_EPOCH="$(git -C /tmp/qembed_context_verify rev-parse --show-toplevel >/dev/null 2>&1 && echo 0 || echo 0)"
              make -C /tmp/qembed_context_verify clean
              make -C /tmp/qembed_context_verify PG_CONFIG="$(command -v pg_config)"
              ldd /tmp/qembed_context_verify/qembed_context_verify.so
              sha256sum /tmp/qembed_context_verify/qembed_context_verify.so
            '
            docker cp "$instance:/tmp/qembed_context_verify/qembed_context_verify.so" "artifacts/$instance.so"
            docker rm -f "$instance"
          done
          cmp artifacts/qembed-build-a.so artifacts/qembed-build-b.so
          sha256sum artifacts/qembed-build-a.so | awk '{print $1}' > artifacts/sha256.txt

      - name: Record source and toolchain provenance
        run: |
          set -euxo pipefail
          docker run --detach --name qembed-provenance \
            --entrypoint bash qembed-qsa003-builder:ci -lc 'sleep infinity'
          docker exec qembed-provenance bash -euxc '
            {
              echo "postgres=$(pg_config --version)"
              echo "pg_config=$(command -v pg_config)"
              echo "compiler=$(cc --version | head -n 1)"
              echo "libsodium=$(pkg-config --modversion libsodium)"
              echo "pgxs=$(pg_config --pgxs)"
              dpkg-query -W -f="package=${Package} version=${Version}\n" \
                build-essential pkg-config libsodium-dev postgresql-server-dev-19
            } > /tmp/toolchain.txt
          '
          docker cp qembed-provenance:/tmp/toolchain.txt artifacts/toolchain.txt
          docker rm -f qembed-provenance
          {
            echo "source_commit=$GITHUB_SHA"
            echo "source_ref=$GITHUB_REF"
            echo "builder_image=$(docker image inspect qembed-qsa003-builder:ci --format '{{.Id}}')"
            echo "binary_sha256=$(cat artifacts/sha256.txt)"
            echo "reproducibility=two independent containers produced byte-identical shared objects"
          } > artifacts/provenance.txt

      - name: Upload binary and provenance manifest
        uses: actions/upload-artifact@v4
        with:
          name: qsa003-verifier-build-provenance
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Attest verifier binary provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/qembed-build-a.so
