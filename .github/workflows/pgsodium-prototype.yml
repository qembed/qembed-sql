name: QSA-003 pgsodium PostgreSQL 19 prototype

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/pgsodium-prototype.yml"
      - "tests/pgsodium_pg19_probe.sql"
      - "docs/QSA-003_PGSODIUM_PROTOTYPE.md"
  workflow_dispatch:

jobs:
  pgsodium-pg19:
    name: Build pgsodium 3.1.11 on PostgreSQL 19
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL 19
        run: |
          docker run --detach --name qembed-pg19 \
            --publish 5432:5432 \
            --env POSTGRES_PASSWORD=postgres \
            pgvector/pgvector:0.8.7-pg19-bookworm
          for attempt in $(seq 1 60); do
            if docker exec qembed-pg19 pg_isready -U postgres -d postgres; then
              exit 0
            fi
            sleep 2
          done
          docker logs qembed-pg19
          exit 1
      - name: Build and install pinned pgsodium release
        run: |
          docker exec --user root qembed-pg19 bash -euxc '
            apt-get update
            apt-get install -y --no-install-recommends build-essential ca-certificates libsodium-dev postgresql-server-dev-19 curl
            test "$(pg_config --version | awk "{print \$2}")" = "19.0"
            # pgsodium 3.1.11 adds ipcrypt APIs requiring libsodium 1.0.22.
            # Debian Bookworm ships 1.0.18, so build the signed upstream libsodium tag.
            curl --fail --location --retry 3 \
              https://codeload.github.com/jedisct1/libsodium/tar.gz/77e1ce5d6dee871c49ef211222ba18ef0c486bda \
              --output /tmp/libsodium-1.0.22.tar.gz
            mkdir -p /tmp/libsodium-src
            tar -xzf /tmp/libsodium-1.0.22.tar.gz --strip-components=1 -C /tmp/libsodium-src
            cd /tmp/libsodium-src
            ./configure --prefix=/usr/local --disable-static
            make -j2
            make install
            ldconfig
            cd /
            curl --fail --location --retry 3 \
              https://codeload.github.com/michelp/pgsodium/tar.gz/a8b8a2739bab1f7a07445b1c911e2bd1abf67784 \
              --output /tmp/pgsodium-3.1.11.tar.gz
            mkdir -p /tmp/pgsodium-src
            tar -xzf /tmp/pgsodium-3.1.11.tar.gz --strip-components=1 -C /tmp/pgsodium-src
            make -C /tmp/pgsodium-src PG_CONFIG="$(command -v pg_config)"
            make -C /tmp/pgsodium-src PG_CONFIG="$(command -v pg_config)" install
          '
      - name: Restart PostgreSQL to load libsodium 1.0.22
        run: |
          docker restart qembed-pg19
          for attempt in $(seq 1 60); do
            if docker exec qembed-pg19 pg_isready -U postgres -d postgres; then
              exit 0
            fi
            sleep 2
          done
          docker logs qembed-pg19
          exit 1
      - name: Verify Ed25519 API and least-privilege execution
        run: |
          docker cp tests/pgsodium_pg19_probe.sql qembed-pg19:/tmp/pgsodium_pg19_probe.sql
          docker exec --user postgres qembed-pg19 \
            psql -X -v ON_ERROR_STOP=1 -d postgres -f /tmp/pgsodium_pg19_probe.sql
