name: QSA-003 pgsodium PostgreSQL 19 prototype

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/pgsodium-prototype.yml"
      - "tests/pgsodium_pg19_probe.sql"
      - "tests/pgsodium_getkey_test.sh"
      - "tests/rt050_transaction_binding_probe.sql"
      - "docs/QSA-003_RT050_TRANSACTION_BINDING_PROBE.md"
      - "docs/QSA-003_PGSODIUM_PROTOTYPE.md"
  workflow_dispatch:

jobs:
  pgsodium-pg19:
    name: Build pgsodium 3.1.11 on PostgreSQL 19
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL 19
        run: |
          docker run --detach --name qembed-pg19 \
            --publish 5432:5432 \
            --env POSTGRES_PASSWORD=postgres \
            pgvector/pgvector:0.8.7-pg19-bookworm
          for attempt in $(seq 1 60); do
            if docker exec qembed-pg19 pg_isready -U postgres -d postgres; then
              exit 0
            fi
            sleep 2
          done
          docker logs qembed-pg19
          exit 1
      - name: Build and install pinned pgsodium release
        run: |
          docker exec --user root qembed-pg19 bash -euxc '
            apt-get update
            apt-get install -y --no-install-recommends build-essential ca-certificates postgresql-server-dev-19 curl
            test "$(pg_config --version | awk "{print \$2}")" = "19.0"
            # pgsodium 3.1.11 adds ipcrypt APIs requiring libsodium 1.0.22.
            # Debian Bookworm ships 1.0.18, so build the signed upstream libsodium tag.
            curl --fail --location --retry 3 \
              https://codeload.github.com/jedisct1/libsodium/tar.gz/77e1ce5d6dee871c49ef211222ba18ef0c486bda \
              --output /tmp/libsodium-1.0.22.tar.gz
            mkdir -p /tmp/libsodium-src
            tar -xzf /tmp/libsodium-1.0.22.tar.gz --strip-components=1 -C /tmp/libsodium-src
            cd /tmp/libsodium-src
            ./configure --prefix=/usr/local --disable-static
            make -j2
            make install
            ldconfig
            cd /
            curl --fail --location --retry 3 \
              https://codeload.github.com/michelp/pgsodium/tar.gz/a8b8a2739bab1f7a07445b1c911e2bd1abf67784 \
              --output /tmp/pgsodium-3.1.11.tar.gz
            mkdir -p /tmp/pgsodium-src
            tar -xzf /tmp/pgsodium-3.1.11.tar.gz --strip-components=1 -C /tmp/pgsodium-src
            make -C /tmp/pgsodium-src PG_CONFIG="$(command -v pg_config)" SHLIB_LINK="/usr/local/lib/libsodium.so"
            ldd /tmp/pgsodium-src/pgsodium.so | grep "/usr/local/lib/libsodium.so.26"
            make -C /tmp/pgsodium-src PG_CONFIG="$(command -v pg_config)" SHLIB_LINK="-L/usr/local/lib -lsodium" install
          '
      - name: Configure pgsodium preload and restart PostgreSQL
        run: |
          docker cp tests/pgsodium_getkey_test.sh qembed-pg19:/usr/share/postgresql/19/extension/pgsodium_getkey
          docker exec --user root qembed-pg19 chmod 755 /usr/share/postgresql/19/extension/pgsodium_getkey
          docker exec --user postgres qembed-pg19 \
            psql -X -v ON_ERROR_STOP=1 -d postgres \
            -c "ALTER SYSTEM SET shared_preload_libraries = 'pgsodium';"
          docker restart qembed-pg19
          for attempt in $(seq 1 60); do
            if docker exec qembed-pg19 pg_isready -U postgres -d postgres; then
              exit 0
            fi
            sleep 2
          done
          docker logs qembed-pg19
          exit 1
      - name: Verify Ed25519 API and least-privilege execution
        run: |
          docker cp tests/pgsodium_pg19_probe.sql qembed-pg19:/tmp/pgsodium_pg19_probe.sql
          docker exec --user postgres qembed-pg19 \
            psql -X -v ON_ERROR_STOP=1 -d postgres -f /tmp/pgsodium_pg19_probe.sql
      - name: Verify RT-050 transaction and audience binding
        run: |
          docker cp tests/rt050_transaction_binding_probe.sql qembed-pg19:/tmp/rt050_transaction_binding_probe.sql
          docker exec --user postgres qembed-pg19 \
            psql -X -v ON_ERROR_STOP=1 -d postgres -f /tmp/rt050_transaction_binding_probe.sql
      - name: Verify backend binding on an independent connection
        run: |
          docker exec -i --user postgres qembed-pg19 \
            psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          SET ROLE qembed_runtime;
          DO $$
          DECLARE v_token record;
          BEGIN
            SELECT * INTO STRICT v_token FROM qsa003_probe.probe_tokens
              WHERE test_case = 'valid';
            IF qsa003_probe.verified_context(v_token.payload, v_token.signature) IS NOT NULL THEN
              RAISE EXCEPTION 'token from another backend was accepted';
            END IF;
          END
          $$;
          RESET ROLE;
          SQL
      - name: Remove prototype fixtures
        if: always()
        run: |
          docker exec --user postgres qembed-pg19 \
            psql -X -v ON_ERROR_STOP=1 -d postgres \
            -c "DROP SCHEMA IF EXISTS qsa003_probe CASCADE; REVOKE ALL ON SCHEMA pgsodium FROM qembed_runtime; REVOKE EXECUTE ON FUNCTION pgsodium.crypto_sign_verify_detached(bytea, bytea, bytea) FROM qembed_runtime; DROP ROLE IF EXISTS qembed_runtime;"
