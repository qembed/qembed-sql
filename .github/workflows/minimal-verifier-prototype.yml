name: QSA-003 minimal Ed25519 verifier PostgreSQL 19 prototype

on:
  push:
    branches: [security/qsa003-extended-fuzz-campaign]
    paths:
      - ".github/workflows/minimal-verifier-prototype.yml"
      - "extensions/qembed_context_verify/**"
      - "tests/fuzz/**"
      - "docs/QSA-003_MINIMAL_VERIFIER_PROTOTYPE.md"
  pull_request:
    branches: [master, prototype/qsa003-canonical-signed-context]
    paths:
      - ".github/workflows/minimal-verifier-prototype.yml"
      - "extensions/qembed_context_verify/**"
      - "tests/fuzz/**"
      - "tests/qembed_context_verify_pg19_probe.sql"
      - "tests/qembed_context_verify_transaction_setup.sql"
      - "tests/qembed_context_verify_transaction_probe.py"
      - "docs/QSA-003_MINIMAL_VERIFIER_PROTOTYPE.md"
  workflow_dispatch:

jobs:
  minimal-verifier-pg19:
    name: Build minimal Ed25519 verifier on PostgreSQL 19
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL 19
        run: |
          docker run --detach --name qembed-pg19-minimal \
            --publish 5432:5432 \
            --env POSTGRES_PASSWORD=postgres \
            pgvector/pgvector:0.8.7-pg19-bookworm
          for attempt in $(seq 1 60); do
            if docker exec qembed-pg19-minimal pg_isready -U postgres -d postgres; then
              exit 0
            fi
            sleep 2
          done
          docker logs qembed-pg19-minimal
          exit 1
      - name: Build against distribution libsodium and PostgreSQL 19
        run: |
          docker exec --user root qembed-pg19-minimal bash -euxc '
            apt-get update
            apt-get install -y --no-install-recommends build-essential pkg-config libsodium-dev postgresql-server-dev-19 python3 python3-psycopg2 python3-venv
            test "$(pg_config --version | cut -d" " -f1-2)" = "PostgreSQL 19.0"
            pkg-config --modversion libsodium
          '
          docker cp extensions/qembed_context_verify qembed-pg19-minimal:/tmp/qembed_context_verify
          docker exec --user root qembed-pg19-minimal bash -euxc '
            make -C /tmp/qembed_context_verify PG_CONFIG="$(command -v pg_config)"
            ldd /tmp/qembed_context_verify/qembed_context_verify.so | grep "libsodium.so.23"
            make -C /tmp/qembed_context_verify PG_CONFIG="$(command -v pg_config)" install
          '
      - name: Verify RFC 8032 vector, least privilege and RLS InitPlan
        run: |
          docker cp tests/qembed_context_verify_pg19_probe.sql qembed-pg19-minimal:/tmp/qembed_context_verify_pg19_probe.sql
          docker exec --user postgres qembed-pg19-minimal \
            psql -X -v ON_ERROR_STOP=1 -d postgres -f /tmp/qembed_context_verify_pg19_probe.sql
      - name: Verify full transaction-bound context with JCS issuer
        run: |
          docker cp tests/qembed_context_verify_transaction_setup.sql qembed-pg19-minimal:/tmp/qembed_context_verify_transaction_setup.sql
          docker cp tests/qembed_context_verify_transaction_probe.py qembed-pg19-minimal:/tmp/qembed_context_verify_transaction_probe.py
          docker exec --user root qembed-pg19-minimal bash -euxc '
            python3 -m venv --system-site-packages /tmp/issuer-venv
            /tmp/issuer-venv/bin/pip install --disable-pip-version-check rfc8785
          '
          docker exec --user postgres qembed-pg19-minimal \
            psql -X -v ON_ERROR_STOP=1 -d postgres -f /tmp/qembed_context_verify_transaction_setup.sql
          docker exec --user postgres qembed-pg19-minimal \
            /tmp/issuer-venv/bin/python /tmp/qembed_context_verify_transaction_probe.py
      - name: Remove PostgreSQL container
        if: always()
        run: docker rm -f qembed-pg19-minimal || true

  verifier-libfuzzer:
    name: Fuzz shared Ed25519 verifier boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang and libsodium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libsodium-dev
      - name: Build sanitizer-instrumented libFuzzer target
        run: |
          clang -std=c11 -O1 -g -fno-omit-frame-pointer \
            -fsanitize=fuzzer,address,undefined \
            -Iextensions/qembed_context_verify \
            tests/fuzz/qembed_context_verify_fuzz.c \
            -lsodium -o /tmp/qembed-context-verify-fuzz
      - name: Run bounded fuzz campaign
        run: |
          mkdir -p /tmp/qembed-context-corpus
          head -c 96 /dev/zero > /tmp/qembed-context-corpus/zero-signature-key
          /tmp/qembed-context-verify-fuzz \
            -max_len=16384 -max_total_time=60 -timeout=2 \
            -print_final_stats=1 /tmp/qembed-context-corpus

  verifier-libfuzzer-extended:
    name: 10-minute ASan/UBSan libFuzzer campaign
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Clang and libsodium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libsodium-dev pkg-config

      - name: Record fuzz environment
        run: |
          mkdir -p "$RUNNER_TEMP/qsa003-fuzz-corpus" "$RUNNER_TEMP/qsa003-fuzz-crashes"
          {
            echo "commit=$GITHUB_SHA"
            echo "runner=$RUNNER_OS"
            echo "clang=$(clang --version | head -n 1)"
            echo "libsodium=$(pkg-config --modversion libsodium)"
            echo "kernel=$(uname -a)"
          } | tee "$RUNNER_TEMP/qsa003-fuzz-environment.txt"

      - name: Build production-shared verifier fuzz target
        run: |
          clang -std=c11 -O1 -g -fno-omit-frame-pointer \\
            -fsanitize=fuzzer,address,undefined \\
            -Iextensions/qembed_context_verify \\
            tests/fuzz/qembed_context_verify_fuzz.c \\
            -lsodium -o "$RUNNER_TEMP/qsa003-context-verify-fuzz"

      - name: Seed valid, malformed, and boundary inputs
        run: |
          corpus="$RUNNER_TEMP/qsa003-fuzz-corpus"
          xxd -r -p tests/fuzz/corpus/valid-empty-message.hex > "$corpus/valid-empty-message"
          head -c 96 /dev/zero > "$corpus/zero-signature-and-key"
          head -c 63 /dev/zero > "$corpus/truncated-signature"
          head -c 95 /dev/zero > "$corpus/truncated-public-key"
          head -c 8289 /dev/zero > "$corpus/oversized-message"

      - name: Run extended sanitizer fuzz campaign
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/qsa003-context-verify-fuzz" \\
            -max_len=16384 \\
            -max_total_time=600 \\
            -timeout=2 \\
            -use_value_profile=1 \\
            -print_final_stats=1 \\
            -artifact_prefix="$RUNNER_TEMP/qsa003-fuzz-crashes/" \\
            "$RUNNER_TEMP/qsa003-fuzz-corpus" \\
            2>&1 | tee "$RUNNER_TEMP/qsa003-fuzz.log"

      - name: Retain fuzz corpus, crash artifacts, and environment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qsa003-extended-fuzz-${{ github.sha }}
          path: |
            ${{ runner.temp }}/qsa003-fuzz-corpus/
            ${{ runner.temp }}/qsa003-fuzz-crashes/
            ${{ runner.temp }}/qsa003-fuzz.log
            ${{ runner.temp }}/qsa003-fuzz-environment.txt
          if-no-files-found: warn
          retention-days: 90
