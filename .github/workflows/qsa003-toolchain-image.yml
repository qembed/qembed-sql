name: QSA-003 archive immutable toolchain image

on:
  pull_request:
    branches: ["prototype/qsa003-canonical-signed-context"]
    paths:
      - "ci/qsa003-toolchain/**"
      - ".github/workflows/qsa003-toolchain-image.yml"

permissions:
  contents: read

jobs:
  publish-toolchain:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish archived toolchain
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/qsa003-toolchain/Dockerfile
          push: true
          tags: ghcr.io/qembed/qembed-sql/qsa003-toolchain:bootstrap-${{ github.event.pull_request.head.sha }}
          build-args: |
            TOOLCHAIN_SOURCE_COMMIT=${{ github.event.pull_request.head.sha }}
          labels: |
            org.opencontainers.image.created=${{ github.event.pull_request.updated_at }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}

      - name: Record immutable image reference
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          IMAGE_TAG: ghcr.io/qembed/qembed-sql/qsa003-toolchain:bootstrap-${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          {
            echo "## QSA-003 archived toolchain"
            echo
            echo "- Tag: `$IMAGE_TAG`"
            echo "- Immutable digest: `ghcr.io/qembed/qembed-sql/qsa003-toolchain@$IMAGE_DIGEST`"
          } >> "$GITHUB_STEP_SUMMARY"
