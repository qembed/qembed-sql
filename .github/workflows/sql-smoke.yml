name: SQL PostgreSQL smoke

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create schema owner
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE qembed_migrator LOGIN SUPERUSER PASSWORD 'migrator'"
      - name: Run PostgreSQL smoke suite
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: qembed_migrator
          PGPASSWORD: migrator
          DB: qembed_smoke
        run: bash tests/run_smoke.sh
