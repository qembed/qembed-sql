name: SQL PostgreSQL smoke

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [master]
  push:
    branches: [master, fix/t-27-caller-memory-rls]

jobs:
  postgres-smoke:
    name: PostgreSQL 19 / pgvector 0.8.7
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Start PostgreSQL 19 with pgvector
        run: |
          docker run --detach --name qembed-postgres \
            --publish 5432:5432 \
            --env POSTGRES_PASSWORD=postgres \
            pgvector/pgvector:0.8.7-pg19-bookworm
          for attempt in $(seq 1 60); do
            if docker exec qembed-postgres pg_isready -U postgres -d postgres; then
              exit 0
            fi
            sleep 2
          done
          docker logs qembed-postgres
          exit 1
      - name: Create schema owner
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE qembed_migrator LOGIN SUPERUSER PASSWORD 'migrator'"
      - name: Run PostgreSQL smoke suite
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: qembed_migrator
          PGPASSWORD: migrator
          DB: qembed_smoke
        run: bash tests/run_smoke.sh
      - name: Build signed-context PostgreSQL verifier for RT-058 migration smoke
        run: |
          docker exec --user root qembed-postgres bash -euxc '
            apt-get update
            apt-get install -y --no-install-recommends build-essential pkg-config libsodium-dev postgresql-server-dev-19 python3 python3-psycopg2 python3-venv
          '
          docker cp extensions/qembed_context_verify qembed-postgres:/tmp/qembed_context_verify
          docker exec --user root qembed-postgres bash -euxc '
            make -C /tmp/qembed_context_verify PG_CONFIG="$(command -v pg_config)"
            make -C /tmp/qembed_context_verify PG_CONFIG="$(command -v pg_config)" install
            python3 -m venv --system-site-packages /tmp/issuer-venv
            /tmp/issuer-venv/bin/pip install --disable-pip-version-check rfc8785
          '
      - name: Run RT-058 incremental migration smoke
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: qembed_migrator
          PGPASSWORD: migrator
          DB: qembed_rt058_migration
        run: bash tests/run_rt058_migration_smoke.sh
      - name: Run RT-061 caller erasure and restore replay smoke
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: qembed_migrator
          PGPASSWORD: migrator
          DB: qembed_rt061_migration
        run: bash tests/run_rt061_migration_smoke.sh
      - name: Run RT-061 Control-plane append-only ledger smoke
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: qembed_migrator
          PGPASSWORD: migrator
          DB: qembed_rt061_control_plane
        run: bash tests/run_rt061_control_plane_migration_smoke.sh
